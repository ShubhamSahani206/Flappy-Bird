<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy bird</title>
    <link rel="stylesheet" href="Flappy_bird.css">
</head>
<body onkeydown="tap()">
    <div id="box1"></div>
    <div id="fly"></div>

    <button onclick="startGame()" id="Playbtn">
        <img src="Play-button.png"/>
    </button>

    <video  loop id="Background" disablePictureInPicture>
        <source src="background.mp4" type="video/mp4">
        </video>
        <audio id="GameOverSound" src="gameOver.mpeg"></audio>
        <div id="GameOver"> 
            <p id="Game">
                Game <p id="Over">Over
                </p>
            </p>            
        </div>

    <script src="Flappy_bird.js"></script>
</body>
</html>
